<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sign In</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="text/javascript" src="/oauth2/js/jquery-3.7.1.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
            padding: 1rem;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 20px;
            padding: 2.5rem 2.75rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255,255,255,0.08);
            animation: slideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 16px;
            margin: 0 auto 1.5rem;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.45);
        }

        .logo svg { width: 26px; height: 26px; fill: #fff; }

        h1 {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: 0.35rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            text-align: center;
            font-size: 0.875rem;
            color: #6b7280;
            margin-bottom: 2rem;
        }

        .field { margin-bottom: 1.25rem; }

        label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.4rem;
            letter-spacing: 0.01em;
        }

        .input-wrap { position: relative; }

        .input-wrap svg.field-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 17px;
            height: 17px;
            color: #9ca3af;
            pointer-events: none;
            transition: color 0.2s;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.7rem 0.875rem 0.7rem 2.6rem;
            font-size: 0.9375rem;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            background: #f9fafb;
            color: #111827;
            outline: none;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        input[type="text"]:focus ~ svg.field-icon,
        input[type="password"]:focus ~ svg.field-icon { color: #667eea; }

        .toggle-pw {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px;
            color: #9ca3af;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }
        .toggle-pw:hover { color: #667eea; }
        .toggle-pw svg { width: 18px; height: 18px; pointer-events: none; }

        .btn-submit {
            width: 100%;
            padding: 0.8rem;
            font-size: 0.9375rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 0.5rem;
            letter-spacing: 0.01em;
            transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 14px rgba(102, 126, 234, 0.45);
        }

        .btn-submit:hover  { opacity: 0.92; box-shadow: 0 6px 20px rgba(102, 126, 234, 0.55); }
        .btn-submit:active { transform: scale(0.98); }

        .footer-link {
            display: block;
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.875rem;
            color: #6b7280;
            text-decoration: none;
        }

        .footer-link span {
            color: #667eea;
            font-weight: 600;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .alert {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.875rem;
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            display: none;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="logo">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 1C8.676 1 6 3.676 6 7v1H4v15h16V8h-2V7c0-3.324-2.676-6-6-6zm0 2c2.276 0 4 1.724 4 4v1H8V7c0-2.276 1.724-4 4-4zm0 9a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/>
            </svg>
        </div>

        <h1>Welcome</h1>
        <p class="subtitle">Sign in to your account</p>

        <form id="login-form" autocomplete="on">
            <div class="field">
                <label for="username">Email</label>
                <div class="input-wrap">
                    <input type="text" id="username" name="username" placeholder="you@example.com" autocomplete="username" required>
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
                    </svg>
                </div>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Show password" tabindex="-1">
                        <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <a id="register" href="" class="footer-link">Don't have an account? <span>Create one</span></a>

        <div id="alert-box" class="alert"></div>
    </div>

    <script>
        $(function () {
            $('#register').attr('href', `/oauth2/register?return_to=${encodeURIComponent(window.location.href)}`);

            $('#toggle-pw').on('click', function () {
                const pw = document.getElementById('password');
                const eyeIcon = document.getElementById('eye-icon');
                if (pw.type === 'password') {
                    pw.type = 'text';
                    eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
                } else {
                    pw.type = 'password';
                    eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
                }
            });

            $('#login-form').submit(function (e) {
                e.preventDefault();

                const data = {
                    data: {
                        Nickname: $('#username').val(),
                        Email: $('#username').val(),
                        Password: $('#password').val(),
                    }
                };

                $.ajax({
                    url: '/oauth2/signin',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    success: function (response) {
                        if (response.success) {
                            const returnTo = getQueryParam("return_to") || '/oauth2/dashboard';
                            window.location.href = returnTo;
                        } else {
                            showAlert("Invalid email or password. Please try again.");
                        }
                    },
                    error: function () {
                        showAlert("Service error. Please try again later.");
                    }
                });
            });

            function showAlert(msg) {
                const box = document.getElementById('alert-box');
                box.textContent = msg;
                box.style.display = 'block';
            }

            function getQueryParam(key) {
                const params = new URLSearchParams(window.location.search);
                return params.get(key);
            }
        });
    </script>

</body>

</html>
